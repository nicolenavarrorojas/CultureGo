<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Ionic App</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!--
    Aplica el modo oscuro guardado ANTES de que se pinte cualquier cosa,
    para evitar el parpadeo de tema claro -> oscuro al abrir la app.
    Debe usar la misma clave/clase que core/services/theme.ts.
  -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('culturego-tema-oscuro') === 'true') {
          document.documentElement.classList.add('tema-oscuro');
        }
      } catch (e) {}
    })();
  </script>

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <app-root></app-root>
</body>

</html>
