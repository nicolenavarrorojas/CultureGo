<ion-modal
  [isOpen]="abierto"
  (didPresent)="onModalPresentado()"
  (didDismiss)="cerrar()"
  (willDismiss)="onModalOcultado()"
>
  <ng-template>
    <ion-header class="ion-no-border">
      <ion-toolbar>
        <ion-title>Sugerir un lugar</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="cerrar()">
            <ion-icon name="close-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="sugerir-contenido" (click)="alTocarContenido($event)">
      <div class="campo-form campo-ubicacion" (keydown.escape)="alPresionarEscape($event)">
        <span>Ubicación del lugar *</span>
        <form class="buscador-direccion" (ngSubmit)="buscarDireccion()">
          <input
            type="search"
            name="direccion"
            [(ngModel)]="direccion"
            (ngModelChange)="cerrarResultados()"
            placeholder="Ej: Av. Providencia 1234"
            autocomplete="street-address"
            enterkeyhint="search"
            [attr.aria-expanded]="resultadosDireccion.length > 0"
            aria-controls="resultados-direccion"
          />
          <button
            type="submit"
            class="boton-buscar"
            [disabled]="buscandoDireccion"
            aria-label="Buscar dirección"
          >
            <ion-spinner name="crescent" *ngIf="buscandoDireccion"></ion-spinner>
            <ion-icon name="search-outline" *ngIf="!buscandoDireccion"></ion-icon>
          </button>
        </form>

        <!-- Menú flotante: se superpone al formulario en vez de empujarlo hacia abajo -->
        <div
          id="resultados-direccion"
          class="resultados-direccion"
          *ngIf="resultadosDireccion.length"
          role="listbox"
          aria-label="Direcciones encontradas"
        >
          <p class="resultados-titulo">Elige la dirección correcta:</p>
          <button
            type="button"
            role="option"
            class="resultado-direccion"
            *ngFor="let resultado of resultadosDireccion"
            (click)="elegirResultado(resultado)"
          >
            {{ resultado.etiqueta }}
          </button>
        </div>
      </div>

      <button
        type="button"
        class="boton-ubicacion"
        [disabled]="obteniendoUbicacion"
        (click)="usarUbicacionActual()"
      >
        <ion-spinner name="crescent" *ngIf="obteniendoUbicacion"></ion-spinner>
        <ion-icon name="locate-outline" *ngIf="!obteniendoUbicacion"></ion-icon>
        {{ obteniendoUbicacion ? 'Buscando tu ubicación...' : 'Usar mi ubicación actual' }}
      </button>

      <p
        class="mensaje-ubicacion"
        [class.mensaje-ubicacion-error]="mensajeUbicacionEsError"
        *ngIf="mensajeUbicacion"
        role="status"
      >
        {{ mensajeUbicacion }}
      </p>

      <p class="instruccion">También puedes tocar el mapa o arrastrar el pin para ajustar el punto.</p>

      <div #mapaContenedor class="mini-mapa"></div>

      <p class="coords-seleccionadas" *ngIf="latitudSeleccionada != null">
        📍 {{ latitudSeleccionada.toFixed(5) }}, {{ longitudSeleccionada?.toFixed(5) }}
      </p>
      <p class="coords-seleccionadas coords-vacias" *ngIf="latitudSeleccionada == null">
        Todavía no has marcado un punto.
      </p>

      <label class="campo-form">
        <span>Nombre del lugar *</span>
        <input type="text" [(ngModel)]="nombre" placeholder="Ej: Feria artesanal de Los Dominicos" />
      </label>

      <label class="campo-form">
        <span>Categoría *</span>
        <ion-select
          [(ngModel)]="idCategoria"
          interface="action-sheet"
          cancelText="Cerrar"
          placeholder="Selecciona una categoría"
        >
          <ion-select-option *ngFor="let categoria of categorias" [value]="categoria.id_categoria">
            {{ categoria.nombre }}
          </ion-select-option>
        </ion-select>
      </label>

      <label class="campo-form">
        <span>Descripción</span>
        <textarea
          [(ngModel)]="descripcion"
          rows="3"
          placeholder="Cuéntanos por qué vale la pena agregarlo"
        ></textarea>
      </label>
    </ion-content>

    <ion-footer class="ion-no-border">
      <div class="footer-enviar">
        <button
          class="boton-enviar"
          [disabled]="!formularioValido || enviando"
          (click)="enviar()"
        >
          <ion-icon name="paper-plane-outline" *ngIf="!enviando"></ion-icon>
          {{ enviando ? 'Enviando...' : 'Enviar sugerencia' }}
        </button>
      </div>
    </ion-footer>
  </ng-template>
</ion-modal>

<ion-toast
  [isOpen]="mostrarToast"
  [message]="toastMensaje"
  [duration]="2500"
  position="top"
  (didDismiss)="mostrarToast = false"
></ion-toast>
