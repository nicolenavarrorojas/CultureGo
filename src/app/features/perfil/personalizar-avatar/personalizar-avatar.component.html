<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/perfil" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Personalizar avatar</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="personalizar-content">

  <!-- Vista previa con las flechas de cada parte a los costados -->
  <div class="fila-personalizacion">

    <div class="columna-flechas">
      <button
        *ngFor="let parte of partes"
        class="flecha"
        [attr.aria-label]="'Anterior: ' + parte.etiqueta"
        (mousedown)="iniciarCambioContinuo(parte.clave, -1)"
        (mouseup)="detenerCambioContinuo()"
        (mouseleave)="detenerCambioContinuo()"
        (touchstart)="iniciarCambioContinuo(parte.clave, -1)"
        (touchend)="detenerCambioContinuo()"
        (touchcancel)="detenerCambioContinuo()"
      >
        <ion-icon name="chevron-back-outline"></ion-icon>
      </button>
    </div>

    <!-- Capas superpuestas sobre la base -->
    <div class="avatar-preview">
      <div class="capa capa-base" [style.backgroundImage]="'url(' + rutaBase + ')'"></div>
      <div
        class="capa capa-cuerpo"
        [style.backgroundImage]="seleccion.cuerpo ? 'url(' + seleccion.cuerpo.url_imagen + ')' : null"
      ></div>
      <div
        class="capa capa-cabeza"
        [style.backgroundImage]="seleccion.cabeza ? 'url(' + seleccion.cabeza.url_imagen + ')' : null"
      ></div>
      <div
        class="capa capa-ojos"
        [style.backgroundImage]="seleccion.ojos ? 'url(' + seleccion.ojos.url_imagen + ')' : null"
      ></div>
      <div
        class="capa capa-boca"
        [style.backgroundImage]="seleccion.boca ? 'url(' + seleccion.boca.url_imagen + ')' : null"
      ></div>
    </div>

    <div class="columna-flechas">
      <button
        *ngFor="let parte of partes"
        class="flecha"
        [attr.aria-label]="'Siguiente: ' + parte.etiqueta"
        (mousedown)="iniciarCambioContinuo(parte.clave, 1)"
        (mouseup)="detenerCambioContinuo()"
        (mouseleave)="detenerCambioContinuo()"
        (touchstart)="iniciarCambioContinuo(parte.clave, 1)"
        (touchend)="detenerCambioContinuo()"
        (touchcancel)="detenerCambioContinuo()"
      >
        <ion-icon name="chevron-forward-outline"></ion-icon>
      </button>
    </div>

  </div>

  <!-- Aviso de futuros accesorios desbloqueables -->
  <div class="tarjeta-recompensas">
    <div class="icono-recompensas">
      <ion-icon name="gift-outline"></ion-icon>
    </div>
    <div class="texto-recompensas">
      <h2>Desbloquea recompensas</h2>
      <p>Aún no has desbloqueado ninguna recompensa. ¡Empieza a visitar lugares!</p>
    </div>
  </div>

  <button class="boton-guardar" (click)="guardar()">Guardar cambios</button>
  <button class="boton-restablecer" (click)="restablecer()">Restablecer valores originales</button>

  <ion-toast
    [isOpen]="mostrarToast"
    [message]="toastMensaje"
    [duration]="1800"
    position="bottom"
    (didDismiss)="mostrarToast = false"
  ></ion-toast>

</ion-content>
