<ion-content [fullscreen]="true" class="recuperar-content">

  <!-- Paso 1: correo -->
  <ng-container *ngIf="paso === 'correo'">
    <div class="encabezado">
      <h1>Recupera tu contraseña</h1>
      <p>Ingresa tu correo y te enviaremos un código para crear una nueva.</p>
    </div>

    <form class="formulario" (ngSubmit)="enviarCorreo()">
      <label class="campo">
        <ion-icon name="mail-outline"></ion-icon>
        <input
          type="email"
          placeholder="Correo electrónico"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          inputmode="email"
          required
        />
      </label>

      <button
        type="submit"
        class="boton-principal"
        [disabled]="!formularioValido || cargando"
      >
        {{ cargando ? 'Enviando...' : 'Enviar código' }}
      </button>
    </form>

    <div class="enlaces">
      <a routerLink="/auth/login">Volver a iniciar sesión</a>
    </div>
  </ng-container>

  <!-- Paso 2: código que llegó al correo -->
  <ng-container *ngIf="paso === 'codigo'">
    <app-verificar-codigo
      [email]="email.trim()"
      titulo="Ingresa el código"
      textoBoton="Continuar"
      textoVolver="Usar otro correo"
      [cargando]="verificando"
      (verificar)="verificarCodigo($event)"
      (reenviar)="reenviarCodigo()"
      (volver)="volverAlCorreo()"
    ></app-verificar-codigo>

    <p class="nota-privacidad">Si el correo está registrado, te llegará un código.</p>
  </ng-container>

  <ion-toast
    [isOpen]="mostrarToast"
    [message]="toastMensaje"
    [duration]="3000"
    [color]="toastColor"
    position="top"
    (didDismiss)="mostrarToast = false"
  ></ion-toast>

</ion-content>
