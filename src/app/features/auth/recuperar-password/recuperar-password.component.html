<ion-content [fullscreen]="true" class="recuperar-content">

  <ng-container *ngIf="!correoEnviado">
    <div class="encabezado">
      <h1>Recupera tu contraseña</h1>
      <p>Ingresa tu correo y te enviaremos un link para crear una nueva.</p>
    </div>

    <form class="formulario" (ngSubmit)="enviarCorreo()">
      <label class="campo">
        <ion-icon name="mail-outline"></ion-icon>
        <input
          type="email"
          placeholder="Correo electrónico"
          [(ngModel)]="email"
          name="email"
          autocomplete="email"
          inputmode="email"
          required
        />
      </label>

      <button
        type="submit"
        class="boton-principal"
        [disabled]="!formularioValido || cargando"
      >
        {{ cargando ? 'Enviando...' : 'Enviar link de recuperación' }}
      </button>
    </form>
  </ng-container>

  <!-- correo enviado -->
  <div class="estado-exito" *ngIf="correoEnviado">
    <ion-icon name="checkmark-circle-outline"></ion-icon>
    <h1>Revisa tu correo</h1>
    <p>Si {{ email }} está registrado, te llegará un link para crear una nueva contraseña.</p>
  </div>

  <div class="enlaces">
    <a routerLink="/auth/login">Volver a iniciar sesión</a>
  </div>

  <ion-toast
    [isOpen]="mostrarToast"
    [message]="toastMensaje"
    [duration]="3000"
    color="danger"
    position="top"
    (didDismiss)="mostrarToast = false"
  ></ion-toast>

</ion-content>
